<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>Survive Chaos</title>
  <meta name="theme-color" content="#080808">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808}
    iframe{display:block;width:100%;height:100%;border:0;background:#080808}
  </style>
</head>
<body>
  <iframe id="game" src="./www/" title="Survive Chaos" allow="fullscreen; autoplay; gamepad" referrerpolicy="same-origin"></iframe>
  <script>
    const f=document.getElementById('game');
    const u=new URL('./www/',location.href);
    for(const [k,v] of new URLSearchParams(location.search))u.searchParams.set(k,v);
    // Internal cache-buster only. The public/share URL remains unchanged.
    u.searchParams.set('build','stable-web-1');
    u.hash=location.hash;
    f.src=u.href;
  </script>
</body>
</html>
