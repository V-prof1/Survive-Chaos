<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Survive Chaos</title>
  <meta http-equiv="refresh" content="0; url=./www/">
  <style>
    html,body{margin:0;min-height:100%;background:#171233;color:#fff6e2;font-family:Arial,sans-serif}
    body{display:grid;place-items:center;text-align:center;padding:24px}
    a{color:#ffcf3f;font-weight:700}
  </style>
</head>
<body>
  <main>
    <h1>Survive Chaos</h1>
    <p>Abrindo o jogo...</p>
    <p><a href="./www/">Toque aqui se o jogo não abrir automaticamente.</a></p>
  </main>
  <script>
    const target = new URL('./www/', location.href);
    target.search = location.search;
    target.hash = location.hash;
    location.replace(target.href);
  </script>
</body>
</html>
