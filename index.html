<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>Survive Chaos</title>
  <meta name="theme-color" content="#171233">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171233}
    iframe{display:block;width:100%;height:100%;border:0;background:#171233}
  </style>
</head>
<body>
  <iframe id="game" src="./www/" title="Survive Chaos" allow="fullscreen; autoplay; gamepad" referrerpolicy="same-origin"></iframe>
  <script>
    const f=document.getElementById('game');
    const u=new URL('./www/',location.href);
    u.search=location.search;
    u.hash=location.hash;
    f.src=u.href;
  </script>
</body>
</html>
