name: Build Survive Chaos APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'www/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  android-debug:
    name: Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund

      - name: Criar projeto Android
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Compilar APK de teste
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Preparar arquivo para download
        shell: bash
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Survive-Chaos-debug.apk

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Survive-Chaos-APK
          path: output/Survive-Chaos-debug.apk
          if-no-files-found: error
          retention-days: 14
