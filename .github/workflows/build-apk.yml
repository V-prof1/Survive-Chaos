name: Build Survive Chaos APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'www/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  android-debug:
    name: Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Instalar Capacitor e gerador de ícones
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm install --no-save @capacitor/assets@3.0.5 --no-audit --no-fund
          python3 -m pip install pillow --quiet

      - name: Criar projeto Android
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Criar ícone oficial do Survive Chaos
        shell: bash
        run: |
          mkdir -p assets
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          from pathlib import Path

          src = Image.open('www/sprites/ui/ui_caveira.png').convert('RGBA')
          bbox = src.getbbox()
          if bbox:
              src = src.crop(bbox)

          S = 1024
          bg = Image.new('RGBA', (S, S), (10, 7, 32, 255))
          px = bg.load()
          cx = cy = S / 2
          maxd = (2 * (cx**2)) ** 0.5
          inner = (56, 44, 116)
          outer = (10, 7, 32)
          for y in range(S):
              for x in range(S):
                  d = (((x-cx)**2 + (y-cy)**2) ** 0.5) / maxd
                  t = min(1.0, d * 1.45)
                  r = int(inner[0] * (1-t) + outer[0] * t)
                  g = int(inner[1] * (1-t) + outer[1] * t)
                  b = int(inner[2] * (1-t) + outer[2] * t)
                  px[x, y] = (r, g, b, 255)

          draw = ImageDraw.Draw(bg)
          # Moldura interna dourada, longe da área de corte dos ícones adaptativos.
          draw.rounded_rectangle((118,118,906,906), radius=190, outline=(255,207,63,255), width=26)
          draw.rounded_rectangle((150,150,874,874), radius=165, outline=(255,90,60,110), width=10)

          target = 535
          scale = min(target/src.width, target/src.height)
          icon = src.resize((max(1,int(src.width*scale)), max(1,int(src.height*scale))), Image.Resampling.NEAREST)

          # Sombra suave atrás da caveira.
          shadow_alpha = icon.getchannel('A').filter(ImageFilter.GaussianBlur(24))
          shadow = Image.new('RGBA', icon.size, (0,0,0,0))
          shadow.putalpha(shadow_alpha.point(lambda v: int(v*0.72)))
          ix = (S-icon.width)//2
          iy = (S-icon.height)//2 - 18
          bg.alpha_composite(shadow, (ix+18, iy+24))
          bg.alpha_composite(icon, (ix, iy))

          # Pequenos acentos laterais para dar leitura mesmo em ícones pequenos.
          draw = ImageDraw.Draw(bg)
          draw.polygon([(184,506),(255,466),(236,518),(292,546),(215,558)], fill=(63,224,197,220))
          draw.polygon([(840,506),(769,466),(788,518),(732,546),(809,558)], fill=(255,90,60,220))

          bg.convert('RGB').save('assets/icon.png', quality=100)
          PY

          npx capacitor-assets generate --android \
            --iconBackgroundColor '#171233' \
            --iconBackgroundColorDark '#171233' \
            --splashBackgroundColor '#171233' \
            --splashBackgroundColorDark '#171233'

          npx cap sync android

      - name: Compilar APK de teste
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Preparar arquivo para download
        shell: bash
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Survive-Chaos-debug.apk

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Survive-Chaos-APK
          path: output/Survive-Chaos-debug.apk
          if-no-files-found: error
          retention-days: 14
