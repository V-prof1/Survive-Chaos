name: Stamp Creator Credit

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/stamp-creator-credit.js'
      - '.github/workflows/stamp-creator-credit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar créditos nos arquivos Web
        run: node scripts/stamp-creator-credit.js
      - name: Salvar comentários no repositório
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Créditos já aplicados.'
            exit 0
          fi
          git config user.name 'Vitor A.'
          git config user.email 'vitoragnus149@gmail.com'
          git add index.html www
          git commit -m 'Stamp creator credit across Web runtime'
          git push
